name: validate-production-release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate immutable CI dependency pins
        run: python scripts/validate_ci_supply_chain.py
      - name: Validate real-project pressure semantics
        run: python scripts/validate_pressure.py
      - name: Validate AAOP production release contract
        run: python scripts/validate_production_release.py
