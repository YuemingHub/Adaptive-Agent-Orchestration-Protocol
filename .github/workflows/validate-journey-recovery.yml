name: validate-journey-recovery

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  journey-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate Journey recovery contract wiring
        run: python scripts/validate_journey_recovery_contract.py
      - name: Validate Journey checkpoint schema and explicit recovery
        run: python scripts/validate_journey_recovery.py
