name: validate-journey-recovery

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  journey-recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate Journey checkpoint schema and explicit recovery
        run: python scripts/validate_journey_recovery.py
