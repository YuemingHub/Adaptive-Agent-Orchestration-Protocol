name: validate-loopx-provider

on:
  pull_request:
    paths:
      - ".aaop/recipes/loopx.json"
      - ".aaop/registries/providers.json"
      - ".aaop/registries/adoption-profiles.json"
      - ".aaop/skills/provider-selection/SKILL.md"
      - ".aaop/skills/capability-planning/SKILL.md"
      - "docs/LOOPX_INTEGRATION.md"
      - "docs/PROGRESSIVE_ADOPTION.md"
      - "scripts/validate_loopx_provider.py"
      - ".github/workflows/validate-loopx-provider.yml"
  push:
    branches: [main]
    paths:
      - ".aaop/recipes/loopx.json"
      - ".aaop/registries/providers.json"
      - ".aaop/registries/adoption-profiles.json"
      - ".aaop/skills/provider-selection/SKILL.md"
      - ".aaop/skills/capability-planning/SKILL.md"
      - "docs/LOOPX_INTEGRATION.md"
      - "docs/PROGRESSIVE_ADOPTION.md"
      - "scripts/validate_loopx_provider.py"
      - ".github/workflows/validate-loopx-provider.yml"

permissions:
  contents: read

jobs:
  validate-loopx-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate LoopX provider authority and selection seam
        run: python scripts/validate_loopx_provider.py
      - name: Validate AAOP package structure
        run: python scripts/validate.py
