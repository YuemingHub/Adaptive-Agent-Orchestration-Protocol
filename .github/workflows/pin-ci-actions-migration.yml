name: pin-ci-actions-migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  pin-actions:
    if: github.head_ref == 'agent/pin-ci-supply-chain'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pin-ci-supply-chain
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Apply deterministic reviewed pin migration
        run: python scripts/pin_ci_actions_migration.py
      - name: Validate migration diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only -- .github/workflows
      - name: Prepare remote commit object without updating a ref
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prepare_ci_pin_commit.py
