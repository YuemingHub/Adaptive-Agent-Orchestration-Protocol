name: pin-ci-actions-migration

on:
  push:
    branches: [agent/pin-ci-supply-chain]

permissions:
  contents: write

jobs:
  pin-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pin-ci-supply-chain
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Apply deterministic reviewed pin migration
        run: python scripts/pin_ci_actions_migration.py
      - name: Commit workflow-only migration when needed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- .github/workflows; then
            echo 'No workflow pin changes remain.'
            exit 0
          fi
          git config user.name 'aaop-ci-migration'
          git config user.email 'aaop-ci-migration@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'chore(ci): pin reviewed GitHub Actions revisions'
          git push origin HEAD:agent/pin-ci-supply-chain
