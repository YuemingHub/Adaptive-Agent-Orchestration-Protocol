name: validate-downstream-consumer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  AAOP_DOWNSTREAM_CONSUMER_SHA: b8c3ddecc1371a281df875c3a115378efca9b504

jobs:
  mingos-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Pull-request default checkout is a synthetic merge ref. Production
          # downstream evidence must exercise the exact candidate HEAD tree.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Checkout pinned real MingOS consumer commit
        shell: bash
        run: |
          set -euo pipefail
          repo='https://github.com/YuemingHub/MingOS.git'
          consumer_sha="$AAOP_DOWNSTREAM_CONSUMER_SHA"
          test "${#consumer_sha}" -eq 40
          candidate_sha="$(git rev-parse HEAD)"
          test "${#candidate_sha}" -eq 40
          git clone --filter=blob:none --no-checkout "$repo" /tmp/mingos-aaop-consumer
          git -C /tmp/mingos-aaop-consumer checkout --detach "$consumer_sha"
          echo "AAOP_DOWNSTREAM_CONSUMER=/tmp/mingos-aaop-consumer" >> "$GITHUB_ENV"
          echo "AAOP_CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "Pinned MingOS consumer commit: $consumer_sha"
          echo "Exact AAOP candidate commit: $candidate_sha"
      - name: Validate real stable-to-v1 consumer compatibility
        run: python scripts/validate_downstream_consumer.py
