name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-aaop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate source package
        run: python scripts/validate.py
      - name: Validate real-project pressure regressions
        run: python scripts/validate_pressure.py
      - name: Validate AAOP source-tree health semantics
        shell: bash
        run: |
          set -euo pipefail
          python .aaop/tools/health.py . --json > /tmp/aaop-source-health.json
          python - /tmp/aaop-source-health.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          expected = open('.aaop/VERSION').read().strip()
          assert d['state'] == 'source-tree', d
          assert d['manifest_present'] is False
          assert d['package_version'] == expected
          assert 'tamper-proof' in d['trust_boundary']
          PY
      - name: Smoke-test installer, environment resolution, routes, recipes, adoption reviews, health, and project-rule preservation
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(cat .aaop/VERSION)"
          target="$(mktemp -d)"
          printf '# Existing project rules\n\nKeep this line.\n' > "$target/AGENTS.md"
          python scripts/install.py "$target"
          grep -q 'Keep this line.' "$target/AGENTS.md"
          grep -q '<!-- AAOP:BEGIN -->' "$target/AGENTS.md"
          grep -q 'route-execution' "$target/AGENTS.md"
          test -f "$target/.aaop/tools/doctor.py"
          test -f "$target/.aaop/tools/health.py"
          test -f "$target/.aaop/tools/route.py"
          test -f "$target/.aaop/tools/recipe.py"
          test -f "$target/.aaop/routes/bug-fix.json"
          test -f "$target/.aaop/routes/idea-to-build.json"
          test -f "$target/.aaop/routes/understand-review.json"
          test -f "$target/.aaop/schemas/environment-inventory.schema.json"
          test -f "$target/.aaop/schemas/installation-health.schema.json"
          test -f "$target/.aaop/schemas/pressure-case.schema.json"
          test -f "$target/.aaop/schemas/integration-recipe.schema.json"
          test -f "$target/.aaop/.install-manifest.json"
          grep -qx "$expected_version" "$target/.aaop/VERSION"

          python "$target/.aaop/tools/health.py" "$target" --json > "$target/health-clean.json"
          python - "$target/health-clean.json" "$target/.aaop/.install-manifest.json" "$expected_version" <<'PY'
          import json, sys
          health = json.load(open(sys.argv[1]))
          manifest = json.load(open(sys.argv[2]))
          expected = sys.argv[3]
          assert health['state'] == 'healthy', health
          assert health['package_version'] == expected
          assert health['manifest_version'] == expected
          assert health['manifest_schema_version'] == 2
          assert health['managed_files']['modified'] == []
          assert health['managed_files']['missing'] == []
          assert health['bootstrap']['AGENTS.md']['status'] == 'current'
          assert health['bootstrap']['CLAUDE.md']['status'] == 'current'
          assert manifest['schema_version'] == 2
          assert manifest['aaop_version'] == expected
          assert set(manifest['bootstrap_blocks']) == {'AGENTS.md', 'CLAUDE.md'}
          assert 'tools/health.py' in manifest['files']
          PY

          # AAOP's own canonical Skills must not inflate the observed external surface.
          python "$target/.aaop/tools/doctor.py" "$target" --json > "$target/doctor-clean.json"
          python - "$target/doctor-clean.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d["observed_surface_level"] == 0, d["observed_surface_level"]
          assert d["provider_detection"]["agent-skills"]["detected"] is True
          assert d["provider_detection"]["agentspace"]["detected"] is False
          assert d["provider_detection"]["autoagent"]["detected"] is False
          assert d["provider_detection"]["microsoft-agent-framework"]["detected"] is False
          PY

          # Simulate an existing Spec Kit CLI and Playwright project dependency.
          mkdir -p "$target/fakebin"
          printf '#!/usr/bin/env sh\nexit 0\n' > "$target/fakebin/specify"
          chmod +x "$target/fakebin/specify"
          cat > "$target/package.json" <<'JSON'
          {
            "devDependencies": {
              "@playwright/test": "1.0.0",
              "some-unrelated-package": "1.0.0"
            }
          }
          JSON
          printf '[project]\nname = "ordinary-python-project"\nversion = "0.0.0"\n' > "$target/pyproject.toml"

          PATH="$target/fakebin:$PATH" python "$target/.aaop/tools/doctor.py" "$target" --route feature-change --json > "$target/doctor-route.json"
          python - "$target/doctor-route.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          providers = d["provider_detection"]
          assert providers["spec-kit"]["detected"] is True
          assert providers["playwright"]["detected"] is True
          assert providers["agentspace"]["detected"] is False
          assert providers["autoagent"]["detected"] is False
          assert providers["microsoft-agent-framework"]["detected"] is False
          assert d["project_signals"]["node_dependencies"]["@playwright/test"] == "1.0.0"
          assert d["route_context"]["route_id"] == "feature-change"
          route_candidates = {x["provider_id"]: x["status"] for x in d["route_context"]["provider_candidates"]}
          assert route_candidates["spec-kit"] == "detected"
          assert route_candidates["playwright"] == "detected"
          assert d["observed_surface_level"] >= 2
          PY

          python "$target/.aaop/tools/route.py" list | grep -q 'bug-fix'
          python "$target/.aaop/tools/route.py" show bug-fix --json > "$target/bug-route.json"
          python "$target/.aaop/tools/route.py" show idea-to-build --json > "$target/idea-route.json"
          python "$target/.aaop/tools/route.py" show understand-review --json > "$target/review-route.json"
          python - "$target/bug-route.json" "$target/idea-route.json" "$target/review-route.json" <<'PY'
          import json, sys
          bug = json.load(open(sys.argv[1]))
          idea = json.load(open(sys.argv[2]))
          review = json.load(open(sys.argv[3]))
          assert {"reported-baseline-freshness", "discussion-is-hypothesis"} <= {g["id"] for g in bug["pressure_guards"]}
          assert {"outcome-before-architecture", "solution-vocabulary-is-hypothesis", "first-slice-must-buy-learning"} <= {g["id"] for g in idea["pressure_guards"]}
          assert {"decision-frame-before-review", "current-source-before-conclusion", "review-is-read-only-by-default"} <= {g["id"] for g in review["pressure_guards"]}
          PY

          python "$target/.aaop/tools/recipe.py" list | grep -q 'spec-kit'
          python "$target/.aaop/tools/recipe.py" list | grep -q 'playwright'
          python "$target/.aaop/tools/recipe.py" list | grep -q 'autoagent'
          python "$target/.aaop/tools/recipe.py" show playwright > "$target/playwright-recipe.json"
          python "$target/.aaop/tools/recipe.py" show autoagent > "$target/autoagent-recipe.json"
          python - "$target/playwright-recipe.json" "$target/autoagent-recipe.json" <<'PY'
          import json, sys
          playwright = json.load(open(sys.argv[1]))
          autoagent = json.load(open(sys.argv[2]))
          assert playwright["provider_id"] == "playwright"
          review = autoagent["adoption_review"]
          assert review["decision_effect"] == "reverify-before-adoption"
          assert "Docker-backed command execution" in review["scope"]
          assert len(review["sources"]) >= 3
          assert len(review["required_checks"]) >= 4
          assert any("not" in note.lower() and "verdict" in note.lower() for note in review.get("notes", [])) or any("not a blanket" in warning.lower() for warning in autoagent.get("warnings", []))
          PY

          python scripts/validate.py --root "$target" --package-only

      - name: Validate installation-health drift classification and state-preserving repair
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(cat .aaop/VERSION)"

          # Manifest-backed drift: managed file + bootstrap edits are detected before repair,
          # then --upgrade backs up managed edits and returns the installation to healthy.
          target="$(mktemp -d)"
          printf '# Project rules\n\nKEEP-OUTSIDE-AAOP\n' > "$target/AGENTS.md"
          python scripts/install.py "$target"
          mkdir -p "$target/.aaop/runtime"
          printf 'runtime-state\n' > "$target/.aaop/runtime/state.txt"
          printf 'project-owned-aaop-file\n' > "$target/.aaop/local-note.txt"
          printf '\nLOCAL-MANAGED-EDIT\n' >> "$target/.aaop/ORCHESTRATOR.md"
          python - "$target/AGENTS.md" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text()
          begin = '<!-- AAOP:BEGIN -->'
          end = '<!-- AAOP:END -->'
          a = text.index(begin)
          b = text.index(end, a) + len(end)
          p.write_text(text[:a] + begin + '\nOLD-AAOP-BOOTSTRAP\n' + end + text[b:])
          PY

          python "$target/.aaop/tools/health.py" "$target" --json > "$target/health-drift.json"
          python - "$target/health-drift.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d['state'] == 'drifted', d
          assert 'ORCHESTRATOR.md' in d['managed_files']['modified']
          assert d['bootstrap']['AGENTS.md']['status'] == 'modified'
          PY

          python scripts/install.py "$target" --upgrade > "$target/upgrade.out"
          grep -q 'AAOP upgraded' "$target/upgrade.out"
          grep -q "version: $expected_version" "$target/upgrade.out"
          grep -q 'KEEP-OUTSIDE-AAOP' "$target/AGENTS.md"
          grep -q 'health.py' "$target/AGENTS.md"
          ! grep -q 'OLD-AAOP-BOOTSTRAP' "$target/AGENTS.md"
          test "$(grep -c '<!-- AAOP:BEGIN -->' "$target/AGENTS.md")" -eq 1
          grep -qx 'runtime-state' "$target/.aaop/runtime/state.txt"
          grep -qx 'project-owned-aaop-file' "$target/.aaop/local-note.txt"
          ! grep -q 'LOCAL-MANAGED-EDIT' "$target/.aaop/ORCHESTRATOR.md"
          grep -R -q 'LOCAL-MANAGED-EDIT' "$target/.aaop/runtime/upgrade-backups"
          python "$target/.aaop/tools/health.py" "$target" --json > "$target/health-repaired.json"
          python - "$target/health-repaired.json" "$target/.aaop/.install-manifest.json" "$expected_version" <<'PY'
          import json, sys
          health = json.load(open(sys.argv[1]))
          manifest = json.load(open(sys.argv[2]))
          expected = sys.argv[3]
          assert health['state'] == 'healthy', health
          assert manifest['aaop_version'] == expected
          assert manifest['schema_version'] == 2
          assert set(manifest['bootstrap_blocks']) == {'AGENTS.md', 'CLAUDE.md'}
          PY

          # --force remains a non-destructive compatibility alias and must be idempotent.
          python scripts/install.py "$target" --force > "$target/force.out"
          grep -q 'AAOP upgraded' "$target/force.out"
          grep -qx 'runtime-state' "$target/.aaop/runtime/state.txt"
          grep -qx 'project-owned-aaop-file' "$target/.aaop/local-note.txt"
          test "$(grep -c '<!-- AAOP:BEGIN -->' "$target/AGENTS.md")" -eq 1

          # Legacy no-manifest installation is observable, then becomes healthy after safe upgrade.
          legacy="$(mktemp -d)"
          printf '# Legacy project\n' > "$legacy/AGENTS.md"
          python scripts/install.py "$legacy"
          rm "$legacy/.aaop/.install-manifest.json"
          mkdir -p "$legacy/.aaop/runtime"
          printf 'legacy-runtime\n' > "$legacy/.aaop/runtime/state.txt"
          printf 'legacy-local\n' > "$legacy/.aaop/local-note.txt"
          python "$legacy/.aaop/tools/health.py" "$legacy" --json > "$legacy/health-before.json"
          python - "$legacy/health-before.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d['state'] == 'legacy-install', d
          PY
          python scripts/install.py "$legacy" --upgrade > "$legacy/upgrade.out"
          grep -q 'legacy upgrade:' "$legacy/upgrade.out"
          grep -qx 'legacy-runtime' "$legacy/.aaop/runtime/state.txt"
          grep -qx 'legacy-local' "$legacy/.aaop/local-note.txt"
          python "$legacy/.aaop/tools/health.py" "$legacy" --json > "$legacy/health-after.json"
          python - "$legacy/health-after.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d['state'] == 'healthy', d
          PY

          # v0.10-style manifest schema lacks bootstrap hashes; classify as upgrade-recommended,
          # not false local drift, even if its historical version field differs.
          old="$(mktemp -d)"
          python scripts/install.py "$old"
          python - "$old/.aaop/.install-manifest.json" <<'PY'
          import json, sys
          p = sys.argv[1]
          d = json.load(open(p))
          d['schema_version'] = 1
          d['aaop_version'] = '0.9.0'
          d.pop('bootstrap_blocks', None)
          with open(p, 'w') as f:
              json.dump(d, f, indent=2, sort_keys=True)
              f.write('\n')
          PY
          python "$old/.aaop/tools/health.py" "$old" --json > "$old/health.json"
          python - "$old/health.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d['state'] == 'upgrade-recommended', d
          assert d['version_mismatch'] is True
          assert d['bootstrap']['AGENTS.md']['status'] == 'present-untracked'
          PY

          # Missing managed content is incomplete, not silently healthy.
          incomplete="$(mktemp -d)"
          python scripts/install.py "$incomplete"
          rm "$incomplete/.aaop/routes/bug-fix.json"
          python "$incomplete/.aaop/tools/health.py" "$incomplete" --json > "$incomplete/health.json"
          python - "$incomplete/health.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d['state'] == 'incomplete', d
          assert 'routes/bug-fix.json' in d['managed_files']['missing']
          PY

          # Malformed bootstrap markers are visible to health and upgrade still fails before
          # mutating an edited managed sentinel.
          broken="$(mktemp -d)"
          printf '# Broken marker project\n' > "$broken/AGENTS.md"
          python scripts/install.py "$broken"
          printf '\nLOCAL-SENTINEL\n' >> "$broken/.aaop/ORCHESTRATOR.md"
          printf '\n<!-- AAOP:BEGIN -->\n' >> "$broken/AGENTS.md"
          python "$broken/.aaop/tools/health.py" "$broken" --json > "$broken/health.json"
          python - "$broken/health.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d['state'] == 'drifted', d
          assert d['bootstrap']['AGENTS.md']['status'] == 'malformed-markers'
          PY
          if python scripts/install.py "$broken" --upgrade > "$broken/upgrade.out" 2>&1; then
            echo 'expected malformed marker upgrade to fail' >&2
            exit 1
          fi
          grep -q 'LOCAL-SENTINEL' "$broken/.aaop/ORCHESTRATOR.md"
          grep -q 'expected exactly one matching AAOP marker pair' "$broken/upgrade.out"

          python scripts/validate.py --root "$target" --package-only
