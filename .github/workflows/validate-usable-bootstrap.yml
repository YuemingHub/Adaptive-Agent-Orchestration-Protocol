name: validate-usable-bootstrap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  usable-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate source and source-tree user CLI
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate.py
          python .aaop/tools/aaop.py version | grep -qx "$(cat .aaop/VERSION)"
          python .aaop/tools/aaop.py ready . --json > /tmp/aaop-source-ready.json
          python - /tmp/aaop-source-ready.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d['ready'] is True, d
          assert d['health_state'] == 'source-tree', d
          assert d['version'] == open('.aaop/VERSION').read().strip(), d
          assert d['starter_prompt'], d
          PY
          test ! -d .aaop/tools/__pycache__

      - name: Validate transactional lifecycle and manifest trust boundaries
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_install_transaction.py

      - name: Validate production bootstrap defaults and hostile archive bounds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('scripts/bootstrap.py')
          spec = importlib.util.spec_from_file_location('aaop_bootstrap', path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          assert module.DEFAULT_REF == 'stable', module.DEFAULT_REF
          assert module.MAX_ARCHIVE_MEMBERS > 0
          assert module.MAX_MEMBER_UNCOMPRESSED_BYTES > 0
          assert module.MAX_TOTAL_UNCOMPRESSED_BYTES >= module.MAX_MEMBER_UNCOMPRESSED_BYTES
          PY

          python - <<'PY'
          from pathlib import Path
          import zipfile
          import scripts.bootstrap as b

          def write_zip(path, members):
              with zipfile.ZipFile(path, 'w', zipfile.ZIP_DEFLATED) as z:
                  for name, content in members:
                      z.writestr(name, content)

          write_zip('/tmp/aaop-traversal.zip', [('../escape.txt', b'x')])
          write_zip('/tmp/aaop-drive.zip', [('C:/escape.txt', b'x')])
          write_zip(
              '/tmp/aaop-member-bomb.zip',
              [('aaop-source/oversized.bin', b'A' * (b.MAX_MEMBER_UNCOMPRESSED_BYTES + 1))],
          )

          with zipfile.ZipFile('/tmp/aaop-count-bomb.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for i in range(b.MAX_ARCHIVE_MEMBERS + 1):
                  z.writestr(f'aaop-source/members/{i}.txt', b'')

          per_member = min(
              b.MAX_MEMBER_UNCOMPRESSED_BYTES - 1,
              (b.MAX_TOTAL_UNCOMPRESSED_BYTES // 5) + 1,
          )
          with zipfile.ZipFile('/tmp/aaop-total-bomb.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              payload = b'B' * per_member
              count = (b.MAX_TOTAL_UNCOMPRESSED_BYTES // per_member) + 1
              for i in range(count):
                  z.writestr(f'aaop-source/expanded/{i}.bin', payload)
          PY

          for archive in /tmp/aaop-traversal.zip /tmp/aaop-drive.zip /tmp/aaop-member-bomb.zip /tmp/aaop-count-bomb.zip /tmp/aaop-total-bomb.zip; do
            target="$(mktemp -d)"
            if python scripts/bootstrap.py --archive "$archive" --target "$target" --skip-ready > /tmp/bootstrap-hostile.out 2>&1; then
              echo "expected hostile archive to fail: $archive" >&2
              exit 1
            fi
            test ! -e "$target/.aaop"
          done
          grep -Eq 'unsafe archive path|safety limit' /tmp/bootstrap-hostile.out

      - name: Build polluted local source archive for bootstrap replay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('.').resolve()
          out = Path('/tmp/aaop-source.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for path in root.rglob('*'):
                  if not path.is_file() or '.git' in path.parts:
                      continue
                  rel = path.relative_to(root)
                  z.write(path, (Path('aaop-source') / rel).as_posix())
              z.writestr('aaop-source/.aaop/tools/__pycache__/regression.cpython-312.pyc', b'generated-cache')
              z.writestr('aaop-source/.aaop/tools/regression.pyo', b'generated-cache')
          print(out)
          PY
          test -s /tmp/aaop-source.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/aaop-source.zip') as z:
              names = z.namelist()
          assert any('__pycache__/' in name for name in names), names
          assert any(name.endswith('.pyo') for name in names), names
          PY

      - name: Install without cloning and report READY
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          echo "$target" > /tmp/aaop-target
          printf '# Existing project rules\n\nKEEP-ME\n' > "$target/AGENTS.md"

          if ! python scripts/bootstrap.py --archive /tmp/aaop-source.zip --target "$target" 2>&1 | tee /tmp/bootstrap-install.out; then
            echo '--- health after failed bootstrap ---' >&2
            if test -f "$target/.aaop/tools/health.py"; then
              python "$target/.aaop/tools/health.py" "$target" --json || true
            fi
            echo '--- manifest after failed bootstrap ---' >&2
            if test -f "$target/.aaop/.install-manifest.json"; then
              cat "$target/.aaop/.install-manifest.json" || true
            fi
            if test -d "$target/.aaop-install-transaction"; then
              echo '--- interrupted lifecycle transaction ---' >&2
              find "$target/.aaop-install-transaction" -maxdepth 3 -type f -print || true
            fi
            exit 1
          fi
          grep -q 'AAOP bootstrap: install' /tmp/bootstrap-install.out
          grep -q 'AAOP READY' /tmp/bootstrap-install.out
          grep -q 'KEEP-ME' "$target/AGENTS.md"
          test -f "$target/.aaop/tools/aaop.py"
          test -f "$target/.aaop/.install-manifest.json"
          test ! -e "$target/.aaop-install-transaction"
          grep -qx "$(cat .aaop/VERSION)" "$target/.aaop/VERSION"

          python - "$target/.aaop/.install-manifest.json" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          managed = list(manifest['files'])
          assert not any('__pycache__' in path for path in managed), managed
          assert not any(path.endswith(('.pyc', '.pyo')) for path in managed), managed
          PY

          python "$target/.aaop/tools/aaop.py" ready "$target" --json > /tmp/aaop-ready.json
          python - /tmp/aaop-ready.json <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          assert d['ready'] is True, d
          assert d['health_state'] == 'healthy', d
          assert 'AGENTS.md' in d['instruction_files'], d
          assert d['starter_prompt'], d
          contract = d['working_contract']
          assert contract['state'] == 'uninitialized', contract
          assert contract['mode'] == 'unset', contract
          assert contract['execution_allowed'] is False, contract
          PY

          prompt="$(python "$target/.aaop/tools/aaop.py" prompt)"
          printf '%s\n' "$prompt" | grep -q 'autonomous/collaborative working mode is not already established'
          printf '%s\n' "$prompt" | grep -q 'ask me that one question once'
          if printf '%s\n' "$prompt" | grep -q 'continue autonomously'; then
            echo 'starter prompt must not silently choose autonomous mode' >&2
            exit 1
          fi
          test ! -d "$target/.aaop/tools/__pycache__"

      - name: Re-running bootstrap is a safe upgrade
        shell: bash
        run: |
          set -euo pipefail
          target="$(cat /tmp/aaop-target)"
          mkdir -p "$target/.aaop/runtime"
          printf 'runtime-state\n' > "$target/.aaop/runtime/state.txt"
          printf 'project-owned\n' > "$target/.aaop/local-note.txt"

          python scripts/bootstrap.py --archive /tmp/aaop-source.zip --target "$target" 2>&1 | tee /tmp/bootstrap-upgrade.out
          grep -q 'AAOP bootstrap: upgrade' /tmp/bootstrap-upgrade.out
          grep -q 'AAOP READY' /tmp/bootstrap-upgrade.out
          test ! -e "$target/.aaop-install-transaction"
          grep -qx 'runtime-state' "$target/.aaop/runtime/state.txt"
          grep -qx 'project-owned' "$target/.aaop/local-note.txt"
          grep -q 'KEEP-ME' "$target/AGENTS.md"
          test ! -d "$target/.aaop/tools/__pycache__"

      - name: Recognizable legacy AAOP can establish manifest ownership
        shell: bash
        run: |
          set -euo pipefail
          legacy="$(mktemp -d)"
          python scripts/bootstrap.py --archive /tmp/aaop-source.zip --target "$legacy" --skip-ready > /tmp/bootstrap-legacy-install.out
          rm "$legacy/.aaop/.install-manifest.json"
          test -f "$legacy/.aaop/ORCHESTRATOR.md"
          grep -q '# AAOP Runtime Protocol' "$legacy/.aaop/ORCHESTRATOR.md"

          python scripts/bootstrap.py --archive /tmp/aaop-source.zip --target "$legacy" 2>&1 | tee /tmp/bootstrap-legacy-upgrade.out
          grep -q 'AAOP bootstrap: upgrade' /tmp/bootstrap-legacy-upgrade.out
          grep -q 'legacy upgrade:' /tmp/bootstrap-legacy-upgrade.out
          grep -q 'AAOP READY' /tmp/bootstrap-legacy-upgrade.out
          test -f "$legacy/.aaop/.install-manifest.json"
          test ! -e "$legacy/.aaop-install-transaction"

      - name: Bootstrap refuses unproven .aaop ownership
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          mkdir -p "$target/.aaop"
          printf '9.9.9\n' > "$target/.aaop/VERSION"
          printf '# Another Tool Orchestrator\n\nNot AAOP.\n' > "$target/.aaop/ORCHESTRATOR.md"
          printf 'unrelated\n' > "$target/.aaop/owner.txt"

          if python scripts/bootstrap.py --archive /tmp/aaop-source.zip --target "$target" > /tmp/bootstrap-refuse.out 2>&1; then
            echo 'expected unproven .aaop ownership to fail' >&2
            exit 1
          fi
          grep -q 'ownership cannot be proven' /tmp/bootstrap-refuse.out
          grep -qx '9.9.9' "$target/.aaop/VERSION"
          grep -q 'Another Tool Orchestrator' "$target/.aaop/ORCHESTRATOR.md"
          grep -qx 'unrelated' "$target/.aaop/owner.txt"
          test ! -f "$target/.aaop/.install-manifest.json"

      - name: Safe removal through the same bootstrap surface
        shell: bash
        run: |
          set -euo pipefail
          target="$(cat /tmp/aaop-target)"
          python scripts/bootstrap.py --archive /tmp/aaop-source.zip --target "$target" --uninstall 2>&1 | tee /tmp/bootstrap-uninstall.out
          grep -q 'AAOP bootstrap removal complete' /tmp/bootstrap-uninstall.out
          test ! -e "$target/.aaop-install-transaction"
          grep -q 'KEEP-ME' "$target/AGENTS.md"
          ! grep -q '<!-- AAOP:BEGIN -->' "$target/AGENTS.md"
          grep -qx 'runtime-state' "$target/.aaop/runtime/state.txt"
          grep -qx 'project-owned' "$target/.aaop/local-note.txt"
          test ! -f "$target/.aaop/ORCHESTRATOR.md"
          test ! -f "$target/.aaop/tools/aaop.py"
