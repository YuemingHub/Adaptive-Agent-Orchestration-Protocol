name: validate-platform-support

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform-support:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Show runtime
        run: python --version
      - name: Validate AAOP source contracts
        run: python scripts/validate.py
      - name: Validate transactional lifecycle
        run: python scripts/validate_install_transaction.py
      - name: Validate Journey state recovery
        run: python scripts/validate_journey_recovery.py
      - name: Validate bootstrap install-upgrade-uninstall lifecycle
        run: python scripts/validate_platform_support.py

  unsupported-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Refuse unsupported runtime before download or target mutation
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          if python scripts/bootstrap.py --archive /definitely/not/read.zip --target "$target" > /tmp/aaop-python-unsupported.out 2>&1; then
            echo 'expected unsupported Python runtime to fail' >&2
            exit 1
          fi
          grep -q 'unsupported Python runtime' /tmp/aaop-python-unsupported.out
          grep -q '3.11–3.14' /tmp/aaop-python-unsupported.out
          test ! -e "$target/.aaop"
          test ! -e "$target/.aaop-install-transaction"
