name: prepare-readme-release-blob

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-readme:
    if: github.head_ref == 'agent/production-release-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/production-release-v1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Prepare synchronized README release blob only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/prepare_readme_release_blob.py
