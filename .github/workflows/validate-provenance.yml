name: validate-provenance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  provenance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate install provenance and authority boundary
        run: python scripts/validate_provenance.py
